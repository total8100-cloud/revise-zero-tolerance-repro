[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omni-lyra"
version = "0.1.0"
description = "Dual-engine autonomous research agent: Nemotron-Terminal + Lyra Lyapunov verifier"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.13",
    "pyyaml>=6.0",
    "docker>=7.0",
    "httpx>=0.27",          # Ollama REST client
    "pydantic>=2.7",
    "rich>=13.0",           # terminal output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
pplm = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.scripts]
omni-lyra = "omni_lyra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["omni_lyra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
